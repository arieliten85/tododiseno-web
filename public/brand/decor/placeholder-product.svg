<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f7f4f0"/>
  <!-- camera body -->
  <rect x="510" y="390" width="180" height="130" rx="16" fill="none" stroke="#c8b8a2" stroke-width="6"/>
  <!-- camera lens -->
  <circle cx="600" cy="455" r="38" fill="none" stroke="#c8b8a2" stroke-width="6"/>
  <circle cx="600" cy="455" r="20" fill="none" stroke="#c8b8a2" stroke-width="4"/>
  <!-- viewfinder bump -->
  <rect x="548" y="378" width="44" height="18" rx="8" fill="none" stroke="#c8b8a2" stroke-width="5"/>
  <!-- flash dot -->
  <circle cx="665" cy="408" r="7" fill="#c8b8a2"/>
  <!-- "Sin imagen" text -->
  <text x="600" y="570" font-family="sans-serif" font-size="28" fill="#b0a090" text-anchor="middle" letter-spacing="2">Sin imagen</text>
</svg>
